services:
  - type: web
    name: nova-trade-web
    env: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run dev
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: INTERNAL_API_SECRET
        value: nova-internal-shared-secret-change-me
      - key: INTERNAL_API_URL
        value: http://localhost:3001
      - key: SOCKET_PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: nova-trade-db
          property: connectionString

databases:
  - name: nova-trade-db
    plan: free
    databaseName: novatrade
    user: novatrade
